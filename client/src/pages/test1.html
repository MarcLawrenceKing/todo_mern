<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <style>
      /* General Styles */
      body {
        font-family: Arial, sans-serif;
        background-color: #0a0908;
        color: #f2f4f3;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* Header */
      h1 {
        color: #f2f4f3;
      }

      /* Buttons */
      button {
        padding: 10px 15px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        margin: 5px;
        color: #f2f4f3;
      }

      .btn-add {
        background-color: #49111c;
      }

      .btn-delete {
        background-color: #5e503f;
      }

      .btn-update {
        background-color: #a9927d;
        color: black;
      }

      /* Task Container */
      .task-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        margin-top: 20px;
      }

      .task-card {
        background: #f2f4f3;
        color: #0a0908;
        padding: 15px;
        border-radius: 10px;
        width: 300px;
        box-shadow: 0 2px 4px rgba(255, 255, 255, 0.2);
        text-align: center;
      }

      /* Priority Labels */
      .priority {
        padding: 5px 10px;
        border-radius: 5px;
        font-weight: bold;
        display: inline-block;
      }

      .priority-high {
        background-color: #49111c;
        color: #f2f4f3;
      }

      .priority-medium {
        background-color: #a9927d;
        color: black;
      }

      .priority-low {
        background-color: #5e503f;
        color: white;
      }

      /* Login Page */
      .login-container {
        background: #f2f4f3;
        color: #0a0908;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(255, 255, 255, 0.2);
        text-align: center;
        width: 300px;
        margin-top: 50px;
      }

      .login-container input {
        width: 100%;
        padding: 8px;
        margin: 10px 0;
        border: 1px solid #49111c;
        border-radius: 5px;
      }

      .login-container button {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <!-- Login Page -->
    <div class="login-container">
      <h2 style="color: #49111c">To-Do List</h2>
      <input type="text" placeholder="Username" />
      <input type="password" placeholder="Password" />
      <button class="btn-add">Login</button>
      <button class="btn-update">Register</button>
    </div>

    <!-- To-Do List -->
    <h1>To-Do List</h1>
    <button class="btn-add">+ Add To-Do</button>

    <div class="task-container">
      <!-- Task 1 -->
      <div class="task-card">
        <h3>Complete Project 1</h3>
        <p>Finish the React to-do app by the end of the week.</p>
        <span class="priority priority-high">HIGH</span>
        <p>Status: <strong>Done</strong></p>
        <button class="btn-update">Update</button>
        <button class="btn-delete">Delete</button>
      </div>

      <!-- Task 2 -->
      <div class="task-card">
        <h3>Complete Project 2</h3>
        <p>Work on documentation.</p>
        <span class="priority priority-medium">MEDIUM</span>
        <p>Status: <strong>Pending</strong></p>
        <button class="btn-update">Update</button>
        <button class="btn-delete">Delete</button>
      </div>

      <!-- Task 3 -->
      <div class="task-card">
        <h3>Complete Project 3</h3>
        <p>Prepare presentation slides.</p>
        <span class="priority priority-low">LOW</span>
        <p>Status: <strong>Ongoing</strong></p>
        <button class="btn-update">Update</button>
        <button class="btn-delete">Delete</button>
      </div>
    </div>
  </body>
</html>
